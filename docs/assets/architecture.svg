<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131922"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="320" rx="18" fill="url(#bg)" stroke="#243040" stroke-width="1.2"/>

  <!-- Header -->
  <text x="32" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">HOW HOTSPOTKEEPER WORKS</text>

  <!-- Step 1: Physical NIC Watcher -->
  <rect x="32" y="64" width="215" height="196" rx="14" fill="#161f2c" stroke="#2a394d" stroke-width="1.2"/>
  <rect x="48" y="80" width="96" height="22" rx="11" fill="#0f2922" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="96" y="95" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">STEP 1 · WATCH</text>
  <text x="48" y="128" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Physical NIC Monitor</text>
  <text x="48" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Reads SCDynamicStore</text>
  <text x="48" y="168" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Service/*/IPv4 directly</text>

  <rect x="48" y="186" width="183" height="58" rx="9" fill="#0f1722" stroke="#233245"/>
  <text x="60" y="206" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Skip utun* (Surge/Clash)</text>
  <text x="60" y="224" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Skip 100.64.* (Tailscale)</text>
  <text x="60" y="239" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Watch en0 · offline 10s</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="247" y1="162" x2="286" y2="162" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Target Filter -->
  <rect x="292" y="64" width="205" height="196" rx="14" fill="#161f2c" stroke="#2a394d" stroke-width="1.2"/>
  <rect x="308" y="80" width="96" height="22" rx="11" fill="#0f2630" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="356" y="95" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">STEP 2 · PIN</text>
  <text x="308" y="128" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Exact Device Filter</text>
  <text x="308" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Matches your pinned</text>
  <text x="308" y="168" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">iPhone among multiple</text>

  <rect x="308" y="186" width="173" height="58" rx="9" fill="#0f1722" stroke="#233245"/>
  <text x="320" y="206" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">● iPhone 16 Pro Max ✓</text>
  <text x="320" y="224" fill="#475569" font-family="-apple-system, sans-serif" font-size="11.5">○ Secondary iPhone</text>
  <text x="320" y="240" fill="#475569" font-family="-apple-system, sans-serif" font-size="11.5">○ iPad Cellular</text>

  <!-- Arrow 2 -> 3A & 3B -->
  <path d="M 497 140 C 520 140, 520 112, 542 112" fill="none" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 497 186 C 520 186, 520 212, 542 212" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>

  <!-- Step 3A: BLE Instant Hotspot -->
  <rect x="548" y="64" width="215" height="92" rx="14" fill="#132524" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.3"/>
  <text x="564" y="88" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PRIMARY · BLE CONTINUITY</text>
  <text x="564" y="110" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Instant Hotspot Wake</text>
  <text x="564" y="130" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">Wakes sleeping hotspot radio</text>
  <text x="564" y="146" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">+ fetches live SSID &amp; password</text>

  <!-- Step 3B: Wi-Fi Keychain Fallback -->
  <rect x="548" y="168" width="215" height="92" rx="14" fill="#161f2c" stroke="#334155" stroke-width="1.2"/>
  <text x="564" y="192" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">FALLBACK · WI-FI KEYCHAIN</text>
  <text x="564" y="214" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Direct SSID Reconnect</text>
  <text x="564" y="234" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">Joins already-broadcasting</text>
  <text x="564" y="250" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">hotspot via macOS Keychain</text>

  <!-- Arrows 3 -> 4 -->
  <path d="M 763 112 C 786 112, 786 154, 804 154" fill="none" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 763 212 C 786 212, 786 170, 804 170" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>

  <!-- Step 4: Online -->
  <rect x="810" y="96" width="118" height="132" rx="14" fill="#0f2922" stroke="#34d399" stroke-width="1.4" filter="url(#glow)"/>
  <circle cx="869" cy="134" r="18" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
  <path d="M 861 134 L 867 140 L 878 128" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="869" y="176" text-anchor="middle" fill="#ecfdf5" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Connected</text>
  <text x="869" y="196" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">172.20.10.x</text>
  <text x="869" y="214" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">Stays pinned</text>

  <!-- Footer note -->
  <text x="32" y="294" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Allows normal macOS sleep · Zero plaintext passwords · Never randomly kicks you off to stray café Wi-Fi</text>
</svg>
