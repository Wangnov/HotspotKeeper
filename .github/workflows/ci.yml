name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binary (-Wall -Wextra -Werror)
        run: |
          chmod +x build.sh
          ./build.sh --universal --no-install
          file build/HotspotKeeper.app/Contents/MacOS/HotspotKeeper
          ./build/HotspotKeeper.app/Contents/MacOS/HotspotKeeper --version
